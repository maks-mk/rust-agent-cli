name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check version consistency
        shell: bash
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          lock=$(awk '/^name = "rust-agent"$/{getline; print $3}' Cargo.lock | tr -d '"')
          echo "Cargo.toml: $manifest, Cargo.lock: $lock"
          if [ "$manifest" != "$lock" ]; then
            echo "Cargo.toml and Cargo.lock versions do not match" >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test all targets
        run: cargo test --locked --all-targets
